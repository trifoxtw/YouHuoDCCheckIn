<!DOCTYPE html>
<html>
<head>
    <title>LINE LIFF Check-in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #mode-status {
            margin: 10px auto 15px;
            padding: 8px 14px;
            display: inline-block;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            background-color: #f0f0f0;
            color: #333;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h2>選擇班別進行打卡</h2>
    <div id="mode-status">模式偵測中...</div>

    <button onclick="checkIn('早診上班')">早診上班</button>
    <button onclick="checkIn('早診下班')">早診下班</button>
    <button onclick="checkIn('午診上班')">午診上班</button>
    <button onclick="checkIn('午診下班')">午診下班</button>
    <button onclick="checkIn('晚診上班')">晚診上班</button>
    <button onclick="checkIn('晚診下班')">晚診下班</button>
    <div id="result"></div>

    <script>
        let userId = '';
        let nfcCode = '';

        // 解析一般網址參數與 LINE LIFF 的 liff.state 參數
        function resolveNfcCode() {
            const urlParams = new URLSearchParams(window.location.search);
            let code = urlParams.get('token') || urlParams.get('nfc') || '';

            // 檢查 LINE LIFF 轉址時夾帶的 liff.state
            if (!code && urlParams.get('liff.state')) {
                const decodedState = decodeURIComponent(urlParams.get('liff.state'));
                const stateQuery = decodedState.includes('?')
                    ? decodedState.split('?')[1]
                    : decodedState.replace(/^\?/, '');
                const stateParams = new URLSearchParams(stateQuery);
                code = stateParams.get('token') || stateParams.get('nfc') || '';
            }

            // 存入 sessionStorage 避免登入重新導向後參數遺失
            if (code) {
                nfcCode = code.trim();
                sessionStorage.setItem('nfc_checkin_code', nfcCode);
            } else {
                nfcCode = sessionStorage.getItem('nfc_checkin_code') || '';
            }

            // 更新畫面上的途徑提示
            const statusEl = document.getElementById('mode-status');
            if (nfcCode) {
                statusEl.innerText = '目前途徑：NFC 感應打卡（免掃描 QR Code）';
                statusEl.style.backgroundColor = '#e6f4ea';
                statusEl.style.color = '#137333';
            } else {
                statusEl.innerText = '目前途徑：QR Code 掃描打卡';
                statusEl.style.backgroundColor = '#f1f3f4';
                statusEl.style.color = '#3c4043';
            }
        }

        async function initializeLIFF() {
            resolveNfcCode();

            try {
                await liff.init({ liffId: '2008064558-DLpEARY3' });
                // init 完成後再檢查一次，確保捕捉到 SDK 解析後的參數
                resolveNfcCode();

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    console.log('User ID:', userId);
                }
            } catch (error) {
                console.error('LIFF 初始化失敗:', error);
                document.getElementById('result').innerText = 'LIFF 初始化失敗，請稍後再試。';
            }
        }

        // 途徑 A：NFC 感應直接送出（不開啟相機）
        function submitByNfc(shift) {
            console.log('執行 NFC 打卡，驗證碼:', nfcCode);
            submitToGoogleForm(shift, nfcCode);
            // 送出後清除暫存，避免下次從一般選單打開仍殘留 NFC 狀態
            sessionStorage.removeItem('nfc_checkin_code');
        }

        // 途徑 B：開啟相機掃描 QR Code 後送出
        async function submitByQrCode(shift) {
            try {
                const result = await liff.scanCodeV2();
                const qrContent = result.value;
                console.log('執行 QR Code 打卡，內容:', qrContent);
                submitToGoogleForm(shift, qrContent);
            } catch (error) {
                console.error('QR Code 掃描失敗:', error);
                document.getElementById('result').innerText = 'QR Code 掃描失敗，請重試。';
            }
        }

        // 共用表單提交函式
        function submitToGoogleForm(shift, verifyContent) {
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfkXPk4mjvH78PNfsXduF8DPg3vf3fmgIfNJXtCR5aIZR69QQ/formResponse';
            const prefilledUrl = `${formUrl}?=usp=pp_url&entry.1366094180=${encodeURIComponent(shift)}&entry.538125100=${encodeURIComponent(userId)}&entry.1841717274=${encodeURIComponent(verifyContent)}`;

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = prefilledUrl;
            document.body.appendChild(iframe);

            const currentTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            document.getElementById('result').innerText = `打卡成功！\n班別：${shift}\n時間：${currentTime}`;

            setTimeout(() => {
                document.body.removeChild(iframe);
            }, 2000);
        }

        // 點擊班別按鈕入口：分流判斷
        async function checkIn(shift) {
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            if (nfcCode) {
                submitByNfc(shift);
            } else {
                await submitByQrCode(shift);
            }
        }

        // 初始化 LIFF
        initializeLIFF();
    </script>
</body>
</html>
