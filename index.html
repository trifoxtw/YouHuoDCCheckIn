<!DOCTYPE html>
<html>
<head>
    <title>LINE LIFF QR Code Check-in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #fallback-box {
            display: none;
            max-width: 340px;
            margin: 16px auto;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        #qr-fallback-reader {
            width: 100%;
        }
        #result {
            margin-top: 24px;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.6;
        }
        #complete-btn {
            display: none;
            margin: 20px auto 0;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #06c755;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="shift-selection">
        <h2>選擇班別進行打卡</h2>
        <button onclick="checkIn('早診上班')">早診上班</button>
        <button onclick="checkIn('早診下班')">早診下班</button>
        <button onclick="checkIn('午診上班')">午診上班</button>
        <button onclick="checkIn('午診下班')">午診下班</button>
        <button onclick="checkIn('晚診上班')">晚診上班</button>
        <button onclick="checkIn('晚診下班')">晚診下班</button>
    </div>

    <div id="fallback-box">
        <p style="margin-top: 0; font-size: 14px;">原生掃碼逾時或異常，已改用備援相機掃描：</p>
        <div id="qr-fallback-reader"></div>
        <button type="button" onclick="cancelFallbackScanner()">取消備援掃描</button>
    </div>

    <div id="result"></div>
    <button id="complete-btn" type="button" onclick="finishAndCloseWindow()">完成打卡</button>

    <script>
        let userId = '';
        let preloadedCode = '';
        let html5QrCode = null;
        let isFallbackRunning = false;
        let closeTimer = null;
        let activeIframe = null;
        let completedShift = '';
        let completedTime = '';

        // 從純文字或 LIFF/一般網址中擷取密鑰（支援 ?code=、?token= 或 liff.state）
        function extractCodeFromInput(rawValue) {
            if (!rawValue) return '';
            const trimmed = String(rawValue).trim();

            try {
                const parsedUrl = new URL(trimmed);
                const directCode = parsedUrl.searchParams.get('code') || parsedUrl.searchParams.get('token');
                if (directCode) {
                    return directCode.trim();
                }

                const liffState = parsedUrl.searchParams.get('liff.state');
                if (liffState) {
                    const decodedState = decodeURIComponent(liffState);
                    const queryPart = decodedState.includes('?')
                        ? decodedState.split('?')[1]
                        : decodedState.replace(/^\?/, '');
                    const stateParams = new URLSearchParams(queryPart);
                    const stateCode = stateParams.get('code') || stateParams.get('token');
                    if (stateCode) {
                        return stateCode.trim();
                    }
                }
            } catch (e) {
                // 非完整 URL，改以字串規則解析
            }

            const match = trimmed.match(/[?&](?:code|token)=([^&#]+)/i);
            if (match && match[1]) {
                return decodeURIComponent(match[1]).trim();
            }

            return trimmed;
        }

        function checkUrlPreloadedCode() {
            const extracted = extractCodeFromInput(window.location.href);
            if (extracted && extracted !== window.location.href.trim()) {
                preloadedCode = extracted;
                console.log('網址自帶密鑰:', preloadedCode);
            }
        }

        async function initializeLIFF() {
            checkUrlPreloadedCode();
            try {
                await liff.init({ liffId: '2008064558-DLpEARY3' });
                checkUrlPreloadedCode();
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    console.log('User ID:', userId);
                }
            } catch (error) {
                console.error('LIFF 初始化失敗:', error);
                document.getElementById('result').innerText = 'LIFF 初始化失敗，請稍後再試。';
            }
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('#shift-selection button, #fallback-box button').forEach(btn => {
                btn.disabled = disabled;
            });
        }

        function scanWithTimeout(timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        reject(new Error('LIFF_SCAN_TIMEOUT'));
                    }
                }, timeoutMs);

                liff.scanCodeV2()
                    .then((res) => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            resolve(res);
                        }
                    })
                    .catch((err) => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            reject(err);
                        }
                    });
            });
        }

        function startFallbackScanner() {
            return new Promise(async (resolve, reject) => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    reject(new Error('此裝置不支援網頁相機串流'));
                    return;
                }

                const box = document.getElementById('fallback-box');
                box.style.display = 'block';
                html5QrCode = new Html5Qrcode('qr-fallback-reader');
                isFallbackRunning = true;

                try {
                    await html5QrCode.start(
                        { facingMode: 'environment' },
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        async (decodedText) => {
                            await stopFallbackScanner();
                            resolve(decodedText);
                        },
                        () => {}
                    );
                } catch (err) {
                    await stopFallbackScanner();
                    reject(err);
                }
            });
        }

        async function stopFallbackScanner() {
            const box = document.getElementById('fallback-box');
            if (html5QrCode && isFallbackRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {
                    console.warn('停止備援相機時發生提示:', e);
                }
            }
            isFallbackRunning = false;
            box.style.display = 'none';
        }

        async function cancelFallbackScanner() {
            await stopFallbackScanner();
            setButtonsDisabled(false);
            document.getElementById('result').innerText = '已取消掃描，請重試。';
        }

        function finishAndCloseWindow() {
            if (closeTimer) {
                clearInterval(closeTimer);
                closeTimer = null;
            }
            if (activeIframe && activeIframe.parentNode) {
                activeIframe.parentNode.removeChild(activeIframe);
                activeIframe = null;
            }

            if (typeof liff !== 'undefined' && liff.isInClient()) {
                liff.closeWindow();
            } else {
                window.close();
                document.body.innerHTML = `
                    <div style="margin-top: 60px; font-family: Arial, sans-serif; text-align: center; padding: 20px;">
                        <h2>打卡已完成</h2>
                        <p>打卡診次：${completedShift}</p>
                        <p>打卡時間：${completedTime}</p>
                        <p style="color: #666; margin-top: 20px;">資料已送出，您現在可以直接關閉此網頁分頁。</p>
                    </div>
                `;
            }
        }

        function renderCountdownText(secondsLeft) {
            document.getElementById('result').innerText =
                `打卡成功\n打卡診次：${completedShift}\n打卡時間：${completedTime}\n\n視窗將於 ${secondsLeft} 秒後自動關閉`;
        }

        function submitForm(shift, qrContent) {
            // Google 表單預填連結
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfkXPk4mjvH78PNfsXduF8DPg3vf3fmgIfNJXtCR5aIZR69QQ/formResponse';
            const prefilledUrl = `${formUrl}?=usp=pp_url&entry.1366094180=${encodeURIComponent(shift)}&entry.538125100=${encodeURIComponent(userId)}&entry.1841717274=${encodeURIComponent(qrContent)}`;

            // 自動提交表單（使用 iframe 隱藏提交過程），完成送出後才開始 10 秒倒數
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            activeIframe = iframe;

            let hasStartedCountdown = false;

            function startCloseCountdown() {
                if (hasStartedCountdown) return;
                hasStartedCountdown = true;

                completedShift = shift;
                completedTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });

                document.getElementById('shift-selection').style.display = 'none';
                document.getElementById('fallback-box').style.display = 'none';
                document.getElementById('complete-btn').style.display = 'inline-block';

                let secondsLeft = 10;
                renderCountdownText(secondsLeft);

                closeTimer = setInterval(() => {
                    secondsLeft -= 1;
                    if (secondsLeft > 0) {
                        renderCountdownText(secondsLeft);
                    } else {
                        finishAndCloseWindow();
                    }
                }, 1000);
            }

            iframe.onload = () => {
                startCloseCountdown();
            };

            const fallbackTimer = setTimeout(() => {
                startCloseCountdown();
            }, 1500);

            iframe.addEventListener('load', () => clearTimeout(fallbackTimer), { once: true });
            iframe.src = prefilledUrl;
        }

        async function checkIn(shift) {
            try {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                setButtonsDisabled(true);
                await stopFallbackScanner();
                let rawScannedValue = '';

                if (preloadedCode) {
                    rawScannedValue = preloadedCode;
                    preloadedCode = '';
                    console.log('使用網址自帶密鑰:', rawScannedValue);
                } else {
                    try {
                        const result = await scanWithTimeout(5000);
                        rawScannedValue = result.value;
                        console.log('原生掃碼原始內容:', rawScannedValue);
                    } catch (primaryError) {
                        console.warn('原生掃碼逾時或失敗，改用備援掃描:', primaryError);
                        document.getElementById('result').innerText = '正在改用備援相機掃描...';
                        rawScannedValue = await startFallbackScanner();
                        console.log('備援掃碼原始內容:', rawScannedValue);
                    }
                }

                const qrContent = extractCodeFromInput(rawScannedValue);
                console.log('最終送出密鑰:', qrContent);

                if (!qrContent) {
                    throw new Error('未取得有效 QR Code 內容');
                }

                submitForm(shift, qrContent);
            } catch (error) {
                console.error('QR Code 掃描失敗:', error);
                await stopFallbackScanner();
                setButtonsDisabled(false);
                document.getElementById('result').innerText = 'QR Code 掃描失敗，請重試。';
            }
        }

        // 初始化 LIFF
        initializeLIFF();
    </script>
</body>
</html>
