<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title>LINE LIFF QR Code 打卡</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-page: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;

            /* 早診：琥珀暖橘系 */
            --morning-bg: #fff7ed;
            --morning-border: #fdba74;
            --morning-text: #9a3412;
            --morning-badge: #ea580c;
            --morning-glow: rgba(234, 88, 12, 0.24);

            /* 午診：青藍系 */
            --afternoon-bg: #f0f9ff;
            --afternoon-border: #7dd3fc;
            --afternoon-text: #075985;
            --afternoon-badge: #0284c7;
            --afternoon-glow: rgba(2, 132, 199, 0.24);

            /* 晚診：靛紫系 */
            --evening-bg: #eef2ff;
            --evening-border: #a5b4fc;
            --evening-text: #3730a3;
            --evening-badge: #4f46e5;
            --evening-glow: rgba(79, 70, 229, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
            text-align: center;
            padding: 12px 14px 20px;
            margin: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        #shift-selection {
            max-width: 440px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px 12px 16px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            padding: 0 2px;
        }

        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            text-align: left;
        }

        #current-time-pill {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            background: #f3f4f6;
            padding: 4px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .shift-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .shift-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            min-height: 54px;
            margin: 0;
            padding: 8px 10px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
            text-align: left;
            line-height: 1.25;
        }

        .shift-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .shift-btn:disabled {
            opacity: 0.48;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .shift-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
            transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease, font-size 0.2s ease, box-shadow 0.2s ease;
        }

        .shift-text-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .shift-label {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .shift-hint {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.78;
            margin-top: 1px;
        }

        /* 早診樣式 */
        .shift-morning {
            background-color: var(--morning-bg);
            border-color: var(--morning-border);
            color: var(--morning-text);
        }
        .shift-morning .shift-icon {
            background-color: var(--morning-badge);
        }

        /* 午診樣式 */
        .shift-afternoon {
            background-color: var(--afternoon-bg);
            border-color: var(--afternoon-border);
            color: var(--afternoon-text);
        }
        .shift-afternoon .shift-icon {
            background-color: var(--afternoon-badge);
        }

        /* 晚診樣式 */
        .shift-evening {
            background-color: var(--evening-bg);
            border-color: var(--evening-border);
            color: var(--evening-text);
        }
        .shift-evening .shift-icon {
            background-color: var(--evening-badge);
        }

        /* 符合目前時間區段的視覺突顯（僅輔助辨識，不鎖定其他按鈕） */
        .shift-btn.time-suggested {
            border-width: 2px;
            transform: translateY(-1px) scale(1.015);
            filter: saturate(1.15);
        }

        .shift-btn.time-suggested .shift-icon {
            width: 34px;
            height: 34px;
            font-size: 16px;
            border-radius: 11px;
            transform: scale(1.08);
        }

        .shift-btn.time-suggested .shift-hint {
            opacity: 1;
            font-weight: 800;
        }

        .shift-morning.time-suggested {
            background-color: #ffedd5;
            border-color: #ea580c;
            box-shadow: 0 4px 14px var(--morning-glow);
        }
        .shift-morning.time-suggested .shift-icon {
            background-color: #c2410c;
            box-shadow: 0 2px 8px var(--morning-glow);
        }

        .shift-afternoon.time-suggested {
            background-color: #e0f2fe;
            border-color: #0284c7;
            box-shadow: 0 4px 14px var(--afternoon-glow);
        }
        .shift-afternoon.time-suggested .shift-icon {
            background-color: #0369a1;
            box-shadow: 0 2px 8px var(--afternoon-glow);
        }

        .shift-evening.time-suggested {
            background-color: #e0e7ff;
            border-color: #4f46e5;
            box-shadow: 0 4px 14px var(--evening-glow);
        }
        .shift-evening.time-suggested .shift-icon {
            background-color: #3730a3;
            box-shadow: 0 2px 8px var(--evening-glow);
        }

        #fallback-box {
            display: none;
            max-width: 340px;
            margin: 14px auto 0;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid #d1d5db;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        #fallback-box button {
            display: block;
            margin: 10px auto 0;
            padding: 9px 18px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #1e293b;
            cursor: pointer;
        }

        #fallback-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #qr-fallback-reader {
            width: 100%;
        }

        #result {
            margin-top: 16px;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.6;
            font-size: 15px;
        }

        #complete-btn {
            display: none;
            margin: 18px auto 0;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #06c755;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="shift-selection">
        <div class="header-row">
            <h2>選擇班別進行打卡</h2>
            <span id="current-time-pill">--:--</span>
        </div>
        <div class="shift-grid">
            <button type="button" class="shift-btn shift-morning" data-shift="早診上班" onclick="checkIn('早診上班')">
                <span class="shift-icon">晨進</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">早診 · 上班</span>
                    <span class="shift-hint">07:00–11:00</span>
                </span>
            </button>
            <button type="button" class="shift-btn shift-morning" data-shift="早診下班" onclick="checkIn('早診下班')">
                <span class="shift-icon">晨退</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">早診 · 下班</span>
                    <span class="shift-hint">11:30–13:00</span>
                </span>
            </button>

            <button type="button" class="shift-btn shift-afternoon" data-shift="午診上班" onclick="checkIn('午診上班')">
                <span class="shift-icon">午進</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">午診 · 上班</span>
                    <span class="shift-hint">13:30–15:30</span>
                </span>
            </button>
            <button type="button" class="shift-btn shift-afternoon" data-shift="午診下班" onclick="checkIn('午診下班')">
                <span class="shift-icon">午退</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">午診 · 下班</span>
                    <span class="shift-hint">17:00–18:00</span>
                </span>
            </button>

            <button type="button" class="shift-btn shift-evening" data-shift="晚診上班" onclick="checkIn('晚診上班')">
                <span class="shift-icon">晚進</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">晚診 · 上班</span>
                    <span class="shift-hint">18:00–19:30</span>
                </span>
            </button>
            <button type="button" class="shift-btn shift-evening" data-shift="晚診下班" onclick="checkIn('晚診下班')">
                <span class="shift-icon">晚退</span>
                <span class="shift-text-wrap">
                    <span class="shift-label">晚診 · 下班</span>
                    <span class="shift-hint">21:00–22:30</span>
                </span>
            </button>
        </div>
    </div>

    <div id="fallback-box">
        <p style="margin-top: 0; font-size: 14px;">原生掃碼逾時或異常，已改用備援相機掃描：</p>
        <div id="qr-fallback-reader"></div>
        <button type="button" onclick="cancelFallbackScanner()">取消備援掃描</button>
    </div>

    <div id="result"></div>
    <button id="complete-btn" type="button" onclick="finishAndCloseWindow()">完成打卡</button>

    <script>
        let userId = '';
        let preloadedCode = '';
        let html5QrCode = null;
        let isFallbackRunning = false;
        let closeTimer = null;
        let activeIframe = null;
        let completedShift = '';
        let completedTime = '';

        function getTaipeiMinutesAndLabel() {
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Taipei',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).formatToParts(now);

            const hour = Number(parts.find(p => p.type === 'hour')?.value ?? 0);
            const minute = Number(parts.find(p => p.type === 'minute')?.value ?? 0);
            const totalMinutes = hour * 60 + minute;
            const hh = String(hour).padStart(2, '0');
            const mm = String(minute).padStart(2, '0');

            return { totalMinutes, label: `${hh}:${mm}` };
        }

        function detectSuggestedShift(totalMinutes) {
            if (totalMinutes >= 7 * 60 && totalMinutes <= 11 * 60) {
                return '早診上班';
            }
            if (totalMinutes >= 11 * 60 + 30 && totalMinutes <= 13 * 60) {
                return '早診下班';
            }
            if (totalMinutes >= 13 * 60 + 30 && totalMinutes <= 15 * 60 + 30) {
                return '午診上班';
            }
            if (totalMinutes >= 17 * 60 && totalMinutes <= 18 * 60) {
                return '午診下班';
            }
            if (totalMinutes >= 18 * 60 && totalMinutes <= 19 * 60 + 30) {
                return '晚診上班';
            }
            if (totalMinutes >= 21 * 60 && totalMinutes <= 22 * 60 + 30) {
                return '晚診下班';
            }
            return '';
        }

        function applyTimeVisualHint() {
            const { totalMinutes, label } = getTaipeiMinutesAndLabel();
            const suggestedShift = detectSuggestedShift(totalMinutes);

            const timePill = document.getElementById('current-time-pill');
            if (timePill) {
                timePill.textContent = suggestedShift ? `${label} · ${suggestedShift}` : label;
            }

            document.querySelectorAll('.shift-btn').forEach((btn) => {
                const shiftName = btn.getAttribute('data-shift');
                const hintEl = btn.querySelector('.shift-hint');
                const defaultHint = hintEl?.getAttribute('data-default-hint') || hintEl?.textContent || '';
                if (hintEl && !hintEl.getAttribute('data-default-hint')) {
                    hintEl.setAttribute('data-default-hint', defaultHint);
                }

                if (suggestedShift && shiftName === suggestedShift) {
                    btn.classList.add('time-suggested');
                    if (hintEl) {
                        hintEl.textContent = `${defaultHint} · 建議`;
                    }
                } else {
                    btn.classList.remove('time-suggested');
                    if (hintEl) {
                        hintEl.textContent = defaultHint;
                    }
                }
            });
        }

        function extractCodeFromInput(rawValue) {
            if (!rawValue) return '';
            const trimmed = String(rawValue).trim();

            try {
                const parsedUrl = new URL(trimmed);
                const directCode = parsedUrl.searchParams.get('code') || parsedUrl.searchParams.get('token');
                if (directCode) {
                    return directCode.trim();
                }

                const liffState = parsedUrl.searchParams.get('liff.state');
                if (liffState) {
                    const decodedState = decodeURIComponent(liffState);
                    const queryPart = decodedState.includes('?')
                        ? decodedState.split('?')[1]
                        : decodedState.replace(/^\?/, '');
                    const stateParams = new URLSearchParams(queryPart);
                    const stateCode = stateParams.get('code') || stateParams.get('token');
                    if (stateCode) {
                        return stateCode.trim();
                    }
                }
            } catch (e) {
                // 非完整 URL，改以字串規則解析
            }

            const match = trimmed.match(/[?&](?:code|token)=([^&#]+)/i);
            if (match && match[1]) {
                return decodeURIComponent(match[1]).trim();
            }

            return trimmed;
        }

        function checkUrlPreloadedCode() {
            const extracted = extractCodeFromInput(window.location.href);
            if (extracted && extracted !== window.location.href.trim()) {
                preloadedCode = extracted;
                console.log('網址自帶密鑰:', preloadedCode);
            }
        }

        async function initializeLIFF() {
            applyTimeVisualHint();
            setInterval(applyTimeVisualHint, 30000);
            checkUrlPreloadedCode();

            try {
                await liff.init({ liffId: '2008064558-DLpEARY3' });
                checkUrlPreloadedCode();
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    console.log('User ID:', userId);
                }
            } catch (error) {
                console.error('LIFF 初始化失敗:', error);
                document.getElementById('result').innerText = 'LIFF 初始化失敗，請稍後再試。';
            }
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('#shift-selection button, #fallback-box button').forEach(btn => {
                btn.disabled = disabled;
            });
        }

        function scanWithTimeout(timeoutMs = 5000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        reject(new Error('LIFF_SCAN_TIMEOUT'));
                    }
                }, timeoutMs);

                liff.scanCodeV2()
                    .then((res) => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            resolve(res);
                        }
                    })
                    .catch((err) => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            reject(err);
                        }
                    });
            });
        }

        function startFallbackScanner() {
            return new Promise(async (resolve, reject) => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    reject(new Error('此裝置不支援網頁相機串流'));
                    return;
                }

                const box = document.getElementById('fallback-box');
                box.style.display = 'block';
                html5QrCode = new Html5Qrcode('qr-fallback-reader');
                isFallbackRunning = true;

                try {
                    await html5QrCode.start(
                        { facingMode: 'environment' },
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        async (decodedText) => {
                            await stopFallbackScanner();
                            resolve(decodedText);
                        },
                        () => {}
                    );
                } catch (err) {
                    await stopFallbackScanner();
                    reject(err);
                }
            });
        }

        async function stopFallbackScanner() {
            const box = document.getElementById('fallback-box');
            if (html5QrCode && isFallbackRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {
                    console.warn('停止備援相機時發生提示:', e);
                }
            }
            isFallbackRunning = false;
            box.style.display = 'none';
        }

        async function cancelFallbackScanner() {
            await stopFallbackScanner();
            setButtonsDisabled(false);
            document.getElementById('result').innerText = '已取消掃描，請重試。';
        }

        function finishAndCloseWindow() {
            if (closeTimer) {
                clearInterval(closeTimer);
                closeTimer = null;
            }
            if (activeIframe && activeIframe.parentNode) {
                activeIframe.parentNode.removeChild(activeIframe);
                activeIframe = null;
            }

            if (typeof liff !== 'undefined' && liff.isInClient()) {
                liff.closeWindow();
            } else {
                window.close();
                document.body.innerHTML = `
                    <div style="margin-top: 60px; font-family: Arial, sans-serif; text-align: center; padding: 20px;">
                        <h2>打卡已完成</h2>
                        <p>打卡診次：${completedShift}</p>
                        <p>打卡時間：${completedTime}</p>
                        <p style="color: #666; margin-top: 20px;">資料已送出，您現在可以直接關閉此網頁分頁。</p>
                    </div>
                `;
            }
        }

        function renderCountdownText(secondsLeft) {
            document.getElementById('result').innerText =
                `打卡成功\n打卡診次：${completedShift}\n打卡時間：${completedTime}\n\n視窗將於 ${secondsLeft} 秒後自動關閉`;
        }

        function submitForm(shift, qrContent) {
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfkXPk4mjvH78PNfsXduF8DPg3vf3fmgIfNJXtCR5aIZR69QQ/formResponse';
            const prefilledUrl = `${formUrl}?=usp=pp_url&entry.1366094180=${encodeURIComponent(shift)}&entry.538125100=${encodeURIComponent(userId)}&entry.1841717274=${encodeURIComponent(qrContent)}`;

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            activeIframe = iframe;

            let hasStartedCountdown = false;

            function startCloseCountdown() {
                if (hasStartedCountdown) return;
                hasStartedCountdown = true;

                completedShift = shift;
                completedTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });

                document.getElementById('shift-selection').style.display = 'none';
                document.getElementById('fallback-box').style.display = 'none';
                document.getElementById('complete-btn').style.display = 'inline-block';

                let secondsLeft = 10;
                renderCountdownText(secondsLeft);

                closeTimer = setInterval(() => {
                    secondsLeft -= 1;
                    if (secondsLeft > 0) {
                        renderCountdownText(secondsLeft);
                    } else {
                        finishAndCloseWindow();
                    }
                }, 1000);
            }

            iframe.onload = () => {
                startCloseCountdown();
            };

            const fallbackTimer = setTimeout(() => {
                startCloseCountdown();
            }, 1500);

            iframe.addEventListener('load', () => clearTimeout(fallbackTimer), { once: true });
            iframe.src = prefilledUrl;
        }

        async function checkIn(shift) {
            try {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                setButtonsDisabled(true);
                await stopFallbackScanner();
                let rawScannedValue = '';

                if (preloadedCode) {
                    rawScannedValue = preloadedCode;
                    preloadedCode = '';
                    console.log('使用網址自帶密鑰:', rawScannedValue);
                } else {
                    try {
                        const result = await scanWithTimeout(5000);
                        rawScannedValue = result.value;
                        console.log('原生掃碼原始內容:', rawScannedValue);
                    } catch (primaryError) {
                        console.warn('原生掃碼逾時或失敗，改用備援掃描:', primaryError);
                        document.getElementById('result').innerText = '正在改用備援相機掃描...';
                        rawScannedValue = await startFallbackScanner();
                        console.log('備援掃碼原始內容:', rawScannedValue);
                    }
                }

                const qrContent = extractCodeFromInput(rawScannedValue);
                console.log('最終送出密鑰:', qrContent);

                if (!qrContent) {
                    throw new Error('未取得有效 QR Code 內容');
                }

                submitForm(shift, qrContent);
            } catch (error) {
                console.error('QR Code 掃描失敗:', error);
                await stopFallbackScanner();
                setButtonsDisabled(false);
                document.getElementById('result').innerText = 'QR Code 掃描失敗，請重試。';
            }
        }

        initializeLIFF();
    </script>
</body>
</html>
