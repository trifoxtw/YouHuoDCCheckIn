<!DOCTYPE html>
<html>
<head>
    <title>LINE LIFF 打卡系統</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #mode-badge {
            display: inline-block;
            padding: 6px 14px;
            margin-bottom: 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .mode-nfc {
            background-color: #e6f4ea;
            color: #137333;
        }
        .mode-qr {
            background-color: #f1f3f4;
            color: #3c4043;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            max-width: 260px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h2>選擇班別進行打卡</h2>
    <div id="mode-badge" class="mode-qr">模式偵測中...</div>

    <button onclick="checkIn('早診上班')">早診上班</button>
    <button onclick="checkIn('早診下班')">早診下班</button>
    <button onclick="checkIn('午診上班')">午診上班</button>
    <button onclick="checkIn('午診下班')">午診下班</button>
    <button onclick="checkIn('晚診上班')">晚診上班</button>
    <button onclick="checkIn('晚診下班')">晚診下班</button>
    <div id="result"></div>

    <script>
        let userId = '';
        let isNfcMode = false;

        // ⚠️ 請將下方網址替換為你的 Google Apps Script 部署網址 (.../exec)
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby2eWayqA_E9-UKHsuK7TbduLwiTZFp1c99FJThlHxqu4QbkXLzQDsWKzjFuujtQuV3/exec';

        // 偵測是否為 NFC 感應進入（支援 ?mode=nfc、#nfc、liff.state 與 sessionStorage）
        function detectCheckInMode() {
            const fullUrl = window.location.href.toLowerCase();
            const search = window.location.search.toLowerCase();
            const hash = window.location.hash.toLowerCase();
            const params = new URLSearchParams(window.location.search);
            const modeParam = (params.get('mode') || params.get('token') || params.get('nfc') || '').toLowerCase();
            const liffState = (params.get('liff.state') || '').toLowerCase();

            if (
                fullUrl.includes('nfc') ||
                search.includes('nfc') ||
                hash.includes('nfc') ||
                modeParam.includes('nfc') ||
                liffState.includes('nfc') ||
                sessionStorage.getItem('is_nfc_mode') === 'true'
            ) {
                isNfcMode = true;
                sessionStorage.setItem('is_nfc_mode', 'true');
            }

            const badge = document.getElementById('mode-badge');
            if (isNfcMode) {
                badge.innerText = '📡 NFC 感應模式（免開相機）';
                badge.className = 'mode-nfc';
            } else {
                badge.innerText = '📷 QR Code 掃描模式';
                badge.className = 'mode-qr';
            }
        }

        async function initializeLIFF() {
            detectCheckInMode();

            try {
                await liff.init({ liffId: '2008064558-DLpEARY3' });
                detectCheckInMode();

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    console.log('User ID:', userId);
                }
            } catch (error) {
                console.error('LIFF 初始化失敗:', error);
                document.getElementById('result').innerText = 'LIFF 初始化失敗，請稍後再試。';
            }
        }

        // 向 Google Apps Script 取得今日動態密碼
        async function fetchDailyPasswordFromGAS() {
            const response = await fetch(GAS_WEB_APP_URL);
            if (!response.ok) {
                throw new Error('無法連線至密碼伺服器');
            }
            const data = await response.json();
            if (!data.code) {
                throw new Error('回傳資料中找不到今日密碼');
            }
            return data.code;
        }

        // 共用送出 Google 表單邏輯
        function submitToGoogleForm(shift, dailyCode) {
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfkXPk4mjvH78PNfsXduF8DPg3vf3fmgIfNJXtCR5aIZR69QQ/formResponse';
            const prefilledUrl = `${formUrl}?=usp=pp_url&entry.1366094180=${encodeURIComponent(shift)}&entry.538125100=${encodeURIComponent(userId)}&entry.1841717274=${encodeURIComponent(dailyCode)}`;

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = prefilledUrl;
            document.body.appendChild(iframe);

            const currentTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            document.getElementById('result').innerText = `打卡成功！\n班別：${shift}\n時間：${currentTime}`;

            // 清除此次 NFC 狀態標記，避免下次手動開啟選單時誤判
            sessionStorage.removeItem('is_nfc_mode');

            setTimeout(() => {
                document.body.removeChild(iframe);
            }, 2000);
        }

        async function checkIn(shift) {
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            if (!userId) {
                document.getElementById('result').innerText = '正在取得 LINE 使用者資料，請稍候 1 秒再按一次。';
                return;
            }

            // 途徑 A：NFC 感應模式（絕對不呼叫 scanCodeV2）
            if (isNfcMode) {
                try {
                    document.getElementById('result').innerText = '⏳ 正在驗證 NFC 並取得今日密碼...';
                    const dailyCode = await fetchDailyPasswordFromGAS();
                    console.log('已取得今日密碼:', dailyCode);
                    submitToGoogleForm(shift, dailyCode);
                } catch (error) {
                    console.error('NFC 取得密碼失敗:', error);
                    document.getElementById('result').innerText = '⚠️ 無法獲取每日亂碼，請確認網路後重試。';
                }
                return;
            }

            // 途徑 B：一般 QR Code 掃描模式
            try {
                const result = await liff.scanCodeV2();
                const qrContent = result.value;
                console.log('QR Code 內容:', qrContent);
                submitToGoogleForm(shift, qrContent);
            } catch (error) {
                console.error('QR Code 掃描失敗:', error);
                document.getElementById('result').innerText = 'QR Code 掃描失敗，請重試。';
            }
        }

        // 初始化 LIFF
        initializeLIFF();
    </script>
</body>
</html>
